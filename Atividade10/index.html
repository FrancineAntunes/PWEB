<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cálculo do IMC</title>
    <script src="script.js" defer></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #fefefe;
        }

        h1 {
            color: #000000;
        }

        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
        }

        input {
            margin-top: 5px;
            padding: 5px;
            width: 200px;
        }

        button {
            margin-top: 15px;
            padding: 8px 15px;
            background-color: #686868;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover {
            background-color: #626363;
        }

        .resultado {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>Cálculo do IMC</h1>

    <label for="peso">Peso (kg):</label>
    <input type="number" id="peso" placeholder="Ex: 70">

    <label for="altura">Altura (m):</label>
    <input type="number" step="0.01" id="altura" placeholder="Ex: 1.75">

    <button onclick="calcular()">Calcular IMC</button>

    <div class="resultado">
        <label for="imc">IMC:</label>
        <input type="text" id="imc" readonly>

        <label for="classificacao">Classificação:</label>
        <input type="text" id="classificacao" readonly>
    </div>
</body>
</html>
