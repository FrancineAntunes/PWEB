<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>Jogo: Pedra, Papel ou Tesoura</title>
  <style>
    body {
      font-family:  Helvetica, Georgia, sans-serif;
      text-align: center;
      margin-top: 50px;
      background-color: #fbe3db;
    }

    .escolhas {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 30px;
    }

    .escolhas img {
      width: 100px;
      height: 200px;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .escolhas img:hover {
      transform: scale(1.1);
    }

    #resultado {
      font-size: 24px;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <h1>Pedra, Papel ou Tesoura</h1>
  <p>Escolha sua jogada:</p>

  <div class="escolhas">
    <img src="pedra.png" alt="Pedra" onclick="jogar('pedra')">
    <img src="papel.png" alt="Papel" onclick="jogar('papel')">
    <img src="tesoura.png" alt="Tesoura" onclick="jogar('tesoura')">
  </div>

  <div id="resultado"></div>

  <script src="script.js"></script>
</body>
</html>
